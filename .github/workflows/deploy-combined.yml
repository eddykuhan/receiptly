name: Deploy API and OCR to EC2

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'dotnet-api/**'
      - 'python-ocr/**'
      - 'llm_service/**'
      - '.github/workflows/deploy-combined.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ap-southeast-1

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2 - ${{ github.ref == 'refs/heads/develop' && 'staging' || github.ref == 'refs/heads/main' && 'production' || github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/develop' && 'staging' || github.ref == 'refs/heads/main' && 'production' || github.event.inputs.environment }}
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EC2 instance details
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=receiptly-${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}-app-server" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "📍 EC2 Instance: $INSTANCE_ID ($INSTANCE_IP)"

      - name: Get credentials from Secrets Manager
        id: secrets
        run: |
          # Get Azure credentials
          AZURE_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id receiptly/azure/credentials \
            --query 'SecretString' \
            --output text)
          
          AZURE_ENDPOINT=$(echo "$AZURE_SECRET" | jq -r '.endpoint')
          AZURE_KEY=$(echo "$AZURE_SECRET" | jq -r '.api_key')
          
          # Get Database credentials
          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id receiptly/database/credentials \
            --query 'SecretString' \
            --output text)
          
          DB_HOST=$(echo "$DB_SECRET" | jq -r '.host')
          DB_PORT=$(echo "$DB_SECRET" | jq -r '.port')
          DB_NAME=$(echo "$DB_SECRET" | jq -r '.database')
          DB_USER=$(echo "$DB_SECRET" | jq -r '.username')
          DB_PASS=$(echo "$DB_SECRET" | jq -r '.password')
          
          # Get S3 credentials
          S3_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id receiptly/s3/credentials \
            --query 'SecretString' \
            --output text)
          
          S3_BUCKET=$(echo "$S3_SECRET" | jq -r '.bucket_name')
          S3_REGION=$(echo "$S3_SECRET" | jq -r '.region')
          
          # Get ECR repositories
          ECR_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id receiptly/ecr/repositories \
            --query 'SecretString' \
            --output text)
          
          DOTNET_API_REPO=$(echo "$ECR_SECRET" | jq -r '.dotnet_api_repository')
          PYTHON_OCR_REPO=$(echo "$ECR_SECRET" | jq -r '.python_ocr_repository')
          LLM_SERVICE_REPO=$(echo "$ECR_SECRET" | jq -r '.llm_service_repository')
          REGISTRY_ID=$(echo "$ECR_SECRET" | jq -r '.registry_id')
          
          # Get OCR service config (includes LLM service URL)
          OCR_SERVICE_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id receiptly/ocr/service \
            --query 'SecretString' \
            --output text)
          
          LLM_SERVICE_URL=$(echo "$OCR_SERVICE_SECRET" | jq -r '.llm_service_url')
          
          # Get LLM service config (includes API keys)
          LLM_SERVICE_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id receiptly/llm/service \
            --query 'SecretString' \
            --output text)
          
          OPENAI_API_KEY=$(echo "$LLM_SERVICE_SECRET" | jq -r '.openai_api_key')
          GROQ_API_KEY=$(echo "$LLM_SERVICE_SECRET" | jq -r '.groq_api_key')
          USE_GROQ=$(echo "$LLM_SERVICE_SECRET" | jq -r '.use_groq')
          MODEL_NAME=$(echo "$LLM_SERVICE_SECRET" | jq -r '.model_name')
          
          echo "azure_endpoint=$AZURE_ENDPOINT" >> $GITHUB_OUTPUT
          echo "azure_key=$AZURE_KEY" >> $GITHUB_OUTPUT
          echo "db_connection=Host=$DB_HOST;Port=$DB_PORT;Database=$DB_NAME;Username=$DB_USER;Password=$DB_PASS" >> $GITHUB_OUTPUT
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT
          echo "db_password=$DB_PASS" >> $GITHUB_OUTPUT
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "s3_region=$S3_REGION" >> $GITHUB_OUTPUT
          echo "dotnet_api_repo=$DOTNET_API_REPO" >> $GITHUB_OUTPUT
          echo "python_ocr_repo=$PYTHON_OCR_REPO" >> $GITHUB_OUTPUT
          echo "llm_service_repo=$LLM_SERVICE_REPO" >> $GITHUB_OUTPUT
          echo "registry_id=$REGISTRY_ID" >> $GITHUB_OUTPUT
          echo "llm_service_url=$LLM_SERVICE_URL" >> $GITHUB_OUTPUT
          echo "openai_api_key=$OPENAI_API_KEY" >> $GITHUB_OUTPUT
          echo "groq_api_key=$GROQ_API_KEY" >> $GITHUB_OUTPUT
          echo "use_groq=$USE_GROQ" >> $GITHUB_OUTPUT
          echo "model_name=$MODEL_NAME" >> $GITHUB_OUTPUT
          echo "✅ Retrieved all credentials from Secrets Manager"

      - name: Free Disk Space
        run: |
          echo "🧹 Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "✅ Disk space freed"
          df -h

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push .NET API to ECR
        run: |
          echo "🏗️ Building and pushing .NET API..."
          cd dotnet-api
          
          # Enable BuildKit for better caching
          export DOCKER_BUILDKIT=1
          
          # Build with cache from ECR
          docker build \
            --platform linux/amd64 \
            --cache-from ${{ steps.secrets.outputs.dotnet_api_repo }}:cache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ steps.secrets.outputs.dotnet_api_repo }}:latest \
            -t ${{ steps.secrets.outputs.dotnet_api_repo }}:${{ github.sha }} \
            .
          
          # Push all tags
          docker push ${{ steps.secrets.outputs.dotnet_api_repo }}:latest
          docker push ${{ steps.secrets.outputs.dotnet_api_repo }}:${{ github.sha }}
          
          # Push cache layer for next build
          docker tag ${{ steps.secrets.outputs.dotnet_api_repo }}:latest ${{ steps.secrets.outputs.dotnet_api_repo }}:cache
          docker push ${{ steps.secrets.outputs.dotnet_api_repo }}:cache
          
          echo "✅ .NET API pushed to ECR"
          
          # Clean up to save disk space
          docker rmi ${{ steps.secrets.outputs.dotnet_api_repo }}:latest \
            ${{ steps.secrets.outputs.dotnet_api_repo }}:${{ github.sha }} \
            ${{ steps.secrets.outputs.dotnet_api_repo }}:cache 2>/dev/null || true
          df -h

      - name: Build and Push Python OCR to ECR
        run: |
          echo "🏗️ Building and pushing Python OCR..."
          
          # Prepare build context with store location data
          echo "📦 Preparing build context with store location data..."
          cd python-ocr
          
          # Copy store-scraper data into build context
          mkdir -p store-scraper-data
          cp -r ../store-scraper/data/* store-scraper-data/
          echo "✅ Copied $(ls -1 store-scraper-data/*.json | wc -l) location files"
          
          # Enable BuildKit for better caching
          export DOCKER_BUILDKIT=1
          
          # Build with cache from ECR
          docker build \
            --platform linux/amd64 \
            --cache-from ${{ steps.secrets.outputs.python_ocr_repo }}:cache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ steps.secrets.outputs.python_ocr_repo }}:latest \
            -t ${{ steps.secrets.outputs.python_ocr_repo }}:${{ github.sha }} \
            .
          
          # Push all tags
          docker push ${{ steps.secrets.outputs.python_ocr_repo }}:latest
          docker push ${{ steps.secrets.outputs.python_ocr_repo }}:${{ github.sha }}
          
          # Push cache layer for next build
          docker tag ${{ steps.secrets.outputs.python_ocr_repo }}:latest ${{ steps.secrets.outputs.python_ocr_repo }}:cache
          docker push ${{ steps.secrets.outputs.python_ocr_repo }}:cache
          
          echo "✅ Python OCR pushed to ECR"
          
          # Clean up to save disk space
          docker rmi ${{ steps.secrets.outputs.python_ocr_repo }}:latest \
            ${{ steps.secrets.outputs.python_ocr_repo }}:${{ github.sha }} \
            ${{ steps.secrets.outputs.python_ocr_repo }}:cache 2>/dev/null || true
          rm -rf store-scraper-data
          df -h

      - name: Build and Push LLM Service to ECR
        run: |
          echo "🏗️ Building and pushing LLM Service..."
          
          # Copy shared-lib into llm_service directory for Docker build context
          echo "📦 Preparing shared-lib for build context..."
          cp -r shared-lib llm_service/shared-lib
          
          cd llm_service
          
          # Enable BuildKit for better caching
          export DOCKER_BUILDKIT=1
          
          # Build with cache from ECR
          docker build \
            --platform linux/amd64 \
            --cache-from ${{ steps.secrets.outputs.llm_service_repo }}:cache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ steps.secrets.outputs.llm_service_repo }}:latest \
            -t ${{ steps.secrets.outputs.llm_service_repo }}:${{ github.sha }} \
            .
          
          # Push all tags
          docker push ${{ steps.secrets.outputs.llm_service_repo }}:latest
          docker push ${{ steps.secrets.outputs.llm_service_repo }}:${{ github.sha }}
          
          # Push cache layer for next build
          docker tag ${{ steps.secrets.outputs.llm_service_repo }}:latest ${{ steps.secrets.outputs.llm_service_repo }}:cache
          docker push ${{ steps.secrets.outputs.llm_service_repo }}:cache
          
          echo "✅ LLM Service pushed to ECR"
          
          # Clean up to save disk space
          docker rmi ${{ steps.secrets.outputs.llm_service_repo }}:latest \
            ${{ steps.secrets.outputs.llm_service_repo }}:${{ github.sha }} \
            ${{ steps.secrets.outputs.llm_service_repo }}:cache 2>/dev/null || true
          
          # Clean up shared-lib copy from build context
          cd ..
          rm -rf llm_service/shared-lib
          
          df -h

      - name: Create environment files
        run: |
          # Create .env for API
          cat > api.env <<EOF
          AWS__Region=${{ env.AWS_REGION }}
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:5000
          Swagger__Enabled=true
          EOF
          
          # Create .env for OCR
          cat > ocr.env <<EOF
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${{ steps.secrets.outputs.azure_endpoint }}
          AZURE_DOCUMENT_INTELLIGENCE_KEY=${{ steps.secrets.outputs.azure_key }}
          LLM_SERVICE_URL=${{ steps.secrets.outputs.llm_service_url }}
          EOF
          
          # Create .env for LLM Service
          cat > llm.env <<EOF
          USE_GROQ=${{ steps.secrets.outputs.use_groq }}
          OPENAI_API_KEY=${{ steps.secrets.outputs.openai_api_key }}
          MODEL_NAME=${{ steps.secrets.outputs.model_name }}
          GROQ_API_KEY=${{ steps.secrets.outputs.groq_api_key }}
          HOST=0.0.0.0
          PORT=8500
          DB_HOST=${{ steps.secrets.outputs.db_host }}
          DB_PORT=${{ steps.secrets.outputs.db_port }}
          DB_NAME=${{ steps.secrets.outputs.db_name }}
          DB_USER=${{ steps.secrets.outputs.db_user }}
          DB_PASSWORD=${{ steps.secrets.outputs.db_password }}
          EOF
          
          # Upload to S3
          aws s3 cp api.env s3://receiptly-terraform-state/deployments/api.env
          aws s3 cp ocr.env s3://receiptly-terraform-state/deployments/ocr.env
          aws s3 cp llm.env s3://receiptly-terraform-state/deployments/llm.env

      - name: Deploy to EC2 using SSM
        run: |
          echo "📦 Deploying to EC2 instance: ${{ steps.ec2.outputs.instance_id }}"
          
          # Execute deployment commands via SSM
          aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo \"=== Login to ECR ===\"",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.secrets.outputs.registry_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
              "echo \"=== Creating Docker network ===\"",
              "docker network create receiptly_default 2>/dev/null || echo \"Network already exists\"",
              "echo \"=== Deploying LLM Service ===\"",
              "cd /opt/receiptly/llm",
              "aws s3 cp s3://receiptly-terraform-state/deployments/llm.env .env",
              "docker pull ${{ steps.secrets.outputs.llm_service_repo }}:latest",
              "systemctl restart receiptly-llm",
              "echo \"=== Deploying Python OCR ===\"",
              "cd /opt/receiptly/ocr",
              "aws s3 cp s3://receiptly-terraform-state/deployments/ocr.env .env",
              "docker pull ${{ steps.secrets.outputs.python_ocr_repo }}:latest",
              "systemctl restart receiptly-ocr",
              "echo \"=== Deploying .NET API ===\"",
              "cd /opt/receiptly/api",
              "aws s3 cp s3://receiptly-terraform-state/deployments/api.env .env",
              "docker pull ${{ steps.secrets.outputs.dotnet_api_repo }}:latest",
              "systemctl restart receiptly-api",
              "echo \"=== Checking services ===\"",
              "systemctl status receiptly-llm --no-pager || true",
              "systemctl status receiptly-ocr --no-pager || true",
              "systemctl status receiptly-api --no-pager || true",
              "docker ps",
              "echo \"✅ Deployment complete\""
            ]' \
            --output text \
            --query 'Command.CommandId' > command_id.txt
          
          COMMAND_ID=$(cat command_id.txt)
          echo "🔄 Command ID: $COMMAND_ID"
          
          # Wait for command to complete
          sleep 15
          
          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --query 'StandardOutputContent' \
            --output text

      - name: Health Check
        run: |
          echo "🏥 Checking services health..."
          sleep 10
          
          API_URL="http://${{ steps.ec2.outputs.instance_ip }}:5000/health"
          OCR_URL="http://${{ steps.ec2.outputs.instance_ip }}:8000/health"
          LLM_URL="http://${{ steps.ec2.outputs.instance_ip }}:8500/docs"
          
          # Check LLM Service
          for i in {1..5}; do
            if curl -f "$LLM_URL"; then
              echo "✅ LLM Service is healthy!"
              break
            fi
            echo "⏳ Waiting for LLM Service... (attempt $i/5)"
            sleep 10
          done
          
          # Check OCR
          for i in {1..5}; do
            if curl -f "$OCR_URL"; then
              echo "✅ Python OCR is healthy!"
              break
            fi
            echo "⏳ Waiting for OCR... (attempt $i/5)"
            sleep 10
          done
          
          # Check API
          for i in {1..5}; do
            if curl -f "$API_URL"; then
              echo "✅ .NET API is healthy!"
              break
            fi
            echo "⏳ Waiting for API... (attempt $i/5)"
            sleep 10
          done

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.ref == 'refs/heads/develop' && 'Staging' || 'Production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Instance:** ${{ steps.ec2.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- **.NET API:** http://${{ steps.ec2.outputs.instance_ip }}:5000" >> $GITHUB_STEP_SUMMARY
          echo "- **Python OCR:** http://${{ steps.ec2.outputs.instance_ip }}:8000" >> $GITHUB_STEP_SUMMARY
          echo "- **LLM Service:** http://${{ steps.ec2.outputs.instance_ip }}:8500" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** http://${{ steps.ec2.outputs.instance_ip }}:5000/health" >> $GITHUB_STEP_SUMMARY
          echo "- **OCR:** http://${{ steps.ec2.outputs.instance_ip }}:8000/health" >> $GITHUB_STEP_SUMMARY
          echo "- **LLM:** http://${{ steps.ec2.outputs.instance_ip }}:8500/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs:** http://${{ steps.ec2.outputs.instance_ip }}:5000/swagger" >> $GITHUB_STEP_SUMMARY
          echo "- **OCR Docs:** http://${{ steps.ec2.outputs.instance_ip }}:8000/docs" >> $GITHUB_STEP_SUMMARY
          echo "- **LLM Docs:** http://${{ steps.ec2.outputs.instance_ip }}:8500/docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.secrets.outputs.dotnet_api_repo }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **OCR:** ${{ steps.secrets.outputs.python_ocr_repo }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **LLM:** ${{ steps.secrets.outputs.llm_service_repo }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
