version: '3.8'

services:
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receiptly-llm-service
    ports:
      - "8500:8500"
    environment:
      # LLM Provider Configuration
      - USE_GROQ=${USE_GROQ:-false}
      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      # Groq Configuration
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8500
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - receiptly-network

networks:
  receiptly-network:
    name: receiptly-network
    external: true
